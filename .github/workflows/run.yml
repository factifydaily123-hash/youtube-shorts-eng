name: Auto Generate and Post YouTube Shorts

on:
  schedule:
    # Base times (US prime-time ET). Actual post = base + random 15-45 min.
    - cron: '0 15 * * *'   # ~11:00 AM ET
    - cron: '0 19 * * *'   # ~3:00 PM ET
    - cron: '0 23 * * *'   # ~7:00 PM ET
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shorts-pipeline
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 75

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    # Randomized anti-spam delay: 15-45 minutes
    - name: Randomized upload delay (anti-spam)
      run: |
        DELAY=$(( (RANDOM % 1800) + 900 ))
        echo "Waiting ${DELAY}s ($((DELAY/60)) min) before pipeline..."
        sleep $DELAY

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          ffmpeg imagemagick libjpeg-dev zlib1g-dev libpng-dev \
          libfreetype6-dev fonts-noto fonts-noto-color-emoji \
          fonts-dejavu fonts-dejavu-core fonts-liberation fontconfig
        sudo fc-cache -f -v

    - name: Fix ImageMagick Policy
      run: |
        sudo sed -i 's/rights="none" pattern="@\*"/rights="read|write" pattern="@*"/' /etc/ImageMagick-6/policy.xml || true
        sudo sed -i 's/policy domain="coder" rights="none" pattern="PDF"/policy domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml || true

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip setuptools wheel
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run Auto-Generation & Auto-Posting Script
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        YOUTUBE_PLAYLIST_ID: ${{ secrets.YOUTUBE_PLAYLIST_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
        TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        TIKTOK_REFRESH_TOKEN: ${{ secrets.TIKTOK_REFRESH_TOKEN }}
        WORD_CAPTIONS: '1'
        ENABLE_CAPTIONS: '0'
        HOOK_CAPTION: '1'
        TTS_VOICE: 'en-US-GuyNeural'
        TTS_RATE: '+15%'
      run: python main.py

    - name: Commit used_topics.json back to repo
      if: always()
      run: |
        if [ -f used_topics.json ]; then
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add used_topics.json
          git diff --staged --quiet || git commit -m "chore: update used_topics [skip ci]"
          git pull --rebase || true
          git push || echo "Push failed, skipping"
        fi

    - name: Notify failure on Telegram
      if: failure()
      run: |
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="❌ AutoShorts pipeline failed on run ${{ github.run_id }}. Check logs."
        fi
